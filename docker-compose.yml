name: room-automation

services:
  mqtt:
    container_name: mosquitto
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    volumes:
      - ./zigbee-stack/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./zigbee-stack/mosquitto/data:/mosquitto/data
      - ./zigbee-stack/mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t healthcheck -m ok -q 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt
    restart: unless-stopped
    volumes:
      - ./zigbee-stack/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    ports:
      # UI de administración en la LAN. No la expongas a Internet:
      # Zigbee2MQTT no tiene login por defecto.
      - "8080:8080"
    environment:
      - TZ=America/Chicago
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    depends_on:
      mqtt:
        condition: service_healthy

  api:
    build:
      context: ./home-hub
      dockerfile: Dockerfile.api
    container_name: home-hub-api
    restart: unless-stopped
    env_file:
      - ./home-hub/.env
    # Solo accesible desde la red interna de Docker (nginx hace de proxy).
    expose:
      - "3000"
    volumes:
      - ./home-hub/data:/app/data
      # Reglas editables sin reconstruir la imagen.
      - ./home-hub/config:/app/config
    depends_on:
      - mqtt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./home-hub
      dockerfile: Dockerfile.web
    container_name: home-hub-web
    restart: unless-stopped
    ports:
      # Dashboard público (con login). El reverse proxy de
      # ra.luisrlp.com también puede entrar por 127.0.0.1:8084.
      - "8084:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
