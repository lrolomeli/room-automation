services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
