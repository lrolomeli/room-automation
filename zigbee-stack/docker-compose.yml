name: zigbee-stack

services:
  mqtt:
    container_name: mosquitto
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      zigbee-net:
        aliases:
          - mqtt
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t healthcheck -m ok -q 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt
    restart: unless-stopped
    volumes:
      - ./zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    ports:
      # Solo accesible desde la propia máquina (SSH tunnel / VPN).
      # No lo expongas directamente a Internet.
      - "127.0.0.1:8080:8080"
    environment:
      - TZ=America/Chicago
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    depends_on:
      - mqtt
    networks:
      - zigbee-net

networks:
  zigbee-net:
    external: true
